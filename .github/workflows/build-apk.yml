name: Build APK Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=roleta_missao12 --org=br.clubrobot

      - name: Corrigir teste padrão do Flutter
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:roleta_missao12/main.dart';

          void main() {
            testWidgets('exibe a tela inicial da Roleta da Sorte', (tester) async {
              await tester.pumpWidget(const RoletaApp());
              expect(find.text('Roleta da Sorte'), findsOneWidget);
              expect(find.text('Gire, escolha e desafie-se!'), findsOneWidget);
            });
          }
          EOF

      - name: Configurar permissões Bluetooth
        run: python3 tool/patch_android.py

      - name: Baixar dependências
        run: flutter pub get

      - name: Verificar código Dart
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: roleta-da-sorte-missao12-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
